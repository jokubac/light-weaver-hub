name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Bundle app for offline use
        run: node scripts/offline-bundle.mjs https://light-weaver-hub.lovable.app offline-app
      - name: Add iOS platform
        run: |
          [ -d ios ] || bunx cap add ios
          bunx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'NOX connects to Bluetooth batteries and lights.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'NOX sends DMX to wireless transmitters on your network.'" ios/App/App/Info.plist || true
      - name: NOX native MIDI
        run: |
          sudo gem install xcodeproj --no-document
          ruby ios-native/install.rb
      - name: App icon
        run: |
          brew install librsvg
          node scripts/ios-icons.mjs
      - name: Release version
        run: |
          echo "APP_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("public/app-release.json", "utf8")).version')" >> "$GITHUB_ENV"
      - name: Write API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive
        run: |
          cd ios/App
          agvtool new-version -all ${{ github.run_number }}
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive -destination generic/platform=iOS \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=com.nox.console \
            MARKETING_VERSION=$APP_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive
      - name: Upload to TestFlight
        run: |
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
