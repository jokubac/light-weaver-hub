name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["capacitor.config.ts", "scripts/**", ".github/workflows/android-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install
      - name: Bundle app for offline use
        run: node scripts/offline-bundle.mjs https://light-weaver-hub.lovable.app offline-app
      - name: Create Android project
        run: |
          [ -d android ] || bunx cap add android
          bunx cap sync android
      - name: Full screen (immersive)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(head -1 "$F")
          cat > "$F" <<EOF
          $PKG
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { super.onCreate(b); hideBars(); }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
