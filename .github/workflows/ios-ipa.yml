name: iOS IPA (unsigned, for Sideloadly)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "scripts/ios-icons.mjs"
      - "scripts/offline-bundle.mjs"
      - "ios-native/**"
      - "capacitor.config.ts"
      - "public/nox-logo.svg"
      - "public/app-release.json"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Bundle app for offline use
        run: node scripts/offline-bundle.mjs https://light-weaver-hub.lovable.app offline-app
      - name: Add iOS platform
        run: |
          [ -d ios ] || bunx cap add ios
          bunx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'NOX connects to Bluetooth batteries and lights.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'NOX sends DMX to wireless transmitters on your network.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'NOX listens to sound so PIXEL effects can react to music.'" ios/App/App/Info.plist || true
          P=ios/App/App/Info.plist
          for K in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$K" $P || true
            /usr/libexec/PlistBuddy -c "Add :$K array" $P
            /usr/libexec/PlistBuddy -c "Add :$K:0 string UIInterfaceOrientationLandscapeLeft" $P
            /usr/libexec/PlistBuddy -c "Add :$K:1 string UIInterfaceOrientationLandscapeRight" $P
          done
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $P
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool true" $P
      - name: NOX native MIDI
        run: |
          sudo gem install xcodeproj --no-document
          ruby ios-native/install.rb
      - name: App icon
        run: |
          brew install librsvg
          node scripts/ios-icons.mjs
      - name: Release version
        run: |
          echo "APP_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("public/app-release.json", "utf8")).version')" >> "$GITHUB_ENV"
      - name: Build unsigned app
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath $RUNNER_TEMP/dd \
            PRODUCT_BUNDLE_IDENTIFIER=com.nox.console \
            MARKETING_VERSION=$APP_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          APP=$(find $RUNNER_TEMP/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p $RUNNER_TEMP/pkg/Payload
          cp -R "$APP" $RUNNER_TEMP/pkg/Payload/
          cd $RUNNER_TEMP/pkg && zip -qry $RUNNER_TEMP/NOX.ipa Payload
      - name: Release information
        run: |
          echo "NOX $APP_VERSION · build ${{ github.run_number }} · ${{ github.sha }}" > "$RUNNER_TEMP/NOX-release.txt"
          echo "### NOX $APP_VERSION — current SVG icon, offline app" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-ipa
          path: |
            ${{ runner.temp }}/NOX.ipa
            ${{ runner.temp }}/NOX-release.txt
